name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for source changes in the last week
        id: changes
        run: |
          if [ -n "$(git log --since='7 days ago' --format=%h -- . ':(exclude)openwiki')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.found == 'true'
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWIKI_MODEL_ID: gemini-3.7-flash

      - name: Create OpenWiki update pull request
        # Same gate as the run step: without it, a quiet week runs this action
        # against an unchanged tree, which closes the open openwiki PR.
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.found == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
          branch: openwiki/update
          commit-message: 'docs: update OpenWiki'
          title: 'docs: update OpenWiki'
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
