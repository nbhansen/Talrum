name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  # Runs the npm code with a read-only token; only the pr job can write (#636).
  generate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.found == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for source changes in the last week
        id: changes
        run: |
          if [ -n "$(git log --since='7 days ago' --format=%h -- . ':(exclude)openwiki')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install OpenWiki
        run: npm ci --prefix .github/openwiki

      - name: Run OpenWiki
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.found == 'true'
        run: .github/openwiki/node_modules/.bin/openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWIKI_MODEL_ID: gemini-3.7-flash

      - name: Upload the wiki
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiki
          path: openwiki
          include-hidden-files: true

  pr:
    needs: generate
    # Same gate as the run step: without it, a quiet week runs create-pull-request
    # against an unchanged tree, which closes the open openwiki PR.
    if: needs.generate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Replace the wiki with the generated one
        run: rm -rf openwiki

      - name: Download the wiki
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwiki
          path: openwiki

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
          branch: openwiki/update
          commit-message: 'docs: update OpenWiki'
          title: 'docs: update OpenWiki'
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
