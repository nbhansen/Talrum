name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The CLI's telemetry writer crashes when two invocations run
      # concurrently (`supabase status` racing the backgrounded serve).
      # CI needs no telemetry; this is the CLI's documented opt-out.
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # config.toml is local-only; prod auth is dashboard-managed (#215,
      # #367). Enforce both halves: no automation pushes config (one push
      # rewrites every [auth] value), and site_url stays localhost so a
      # stray push can never apply prod-shaped values. [ ] dodges self-match.
      - name: config.toml stays local-only
        run: |
          if grep -rEn 'supabase config[ ]+push' .github scripts package.json; then
            echo '::error::Pushing config.toml to the linked project is forbidden - production auth is dashboard-managed (#215, #367).'
            exit 1
          fi
          if ! grep -qE '^site_url = "http://localhost:' supabase/config.toml; then
            echo '::error::supabase/config.toml site_url must be a localhost URL - it is a local-dev fixture (#367).'
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      # Canary for the layer map (#397): a resolver failure would silently
      # no-op boundaries/dependencies while lint stays green. This asserts a
      # known violation still errors.
      - run: npm run lint:boundaries
      - run: npm run lint:css
      # Caps comment length (AGENTS.md §4, #450). Nothing else stops an agent
      # writing more prose about the code than code.
      - run: npm run lint:comments
      # Nothing enforced prettier before (#382): lint-staged's glob was
      # root-only, so anything under src/ or .github/ drifted unnoticed and
      # then surfaced as unrelated churn in whichever PR next touched the file.
      - run: npm run format:check
      # Coverage thresholds (vite.config.ts) gate here — they are ratchet
      # floors: raise them as coverage rises, never lower them to pass.
      - run: npm run test:coverage
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:functions
      - uses: supabase/setup-cli@v2
        with:
          # Pinned: v2.106.0 (2026-06-11) ported `gen types` to the new TS CLI
          # and broke `--local` generation ("Access token not provided"),
          # failing the types-drift step. Bump deliberately after verifying
          # `supabase gen types typescript --local` works without a token.
          version: 2.105.0
      - name: Reserve Supabase ports from ephemeral assignment (#310)
        # Supabase's fixed host ports (5432x) sit inside the kernel's ephemeral
        # source-port range (32768–60999). A runner process's outbound connection
        # can land on one, and `supabase start` then dies binding it (EADDRINUSE).
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - run: supabase start
      - name: Regenerate supabase types and fail on drift (#132)
        run: |
          npm run types:db
          git diff --exit-code src/types/supabase.ts
      - run: npm run test:db
      - name: Serve function in background
        run: |
          # Captured before the backgrounded serve starts: a concurrent
          # `supabase status` hits the telemetry race and can empty API_URL.
          # The runtime injects its own SUPABASE_* env; no env file needed.
          API_URL="$(supabase status -o json | jq -r '.API_URL')"
          nohup supabase functions serve delete-account &>/tmp/funcs.log &
          SERVE_PID=$!
          # A 401 probe cannot tell the old edge runtime from the one
          # `functions serve` swaps in, so probing alone raced the swap and
          # the e2e step got a 502 (#477). Wait for the new runtime's own
          # serving line before probing.
          served=0
          for i in {1..60}; do
            if grep -q 'Serving functions on' /tmp/funcs.log; then
              served=1; break
            fi
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              echo "supabase functions serve exited before serving" >&2
              cat /tmp/funcs.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$served" -ne 1 ]]; then
            echo "runtime did not log 'Serving functions on' within 60s" >&2
            cat /tmp/funcs.log >&2 || true
            exit 1
          fi
          # 401 through Kong proves the runtime answers; a 5xx means Kong
          # does not reach it yet, and accepting one would run the e2e step
          # against a stalled runtime. Require a 4xx.
          ready=0
          for i in {1..30}; do
            STATUS=$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "$API_URL/functions/v1/delete-account" || echo "000")
            if [[ "$STATUS" =~ ^4[0-9][0-9]$ ]]; then
              echo "function ready (HTTP $STATUS)"; ready=1; break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "function did not become ready within 30s (last HTTP $STATUS)" >&2
            cat /tmp/funcs.log >&2 || true
            exit 1
          fi
      - run: npm run test:e2e:delete-account
      - if: failure()
        name: Dump function logs on failure
        run: cat /tmp/funcs.log || true
      - if: always()
        run: supabase stop

  migration-drift:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # With the DB password, `supabase link` stores session-pooler (IPv4)
      # credentials. Without it the CLI can dial the direct IPv6 address,
      # unreachable from GitHub runners after a free-tier auto-pause.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Optional override: a full session-pooler connection string; when set,
      # the drift script uses --db-url and skips --linked entirely.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Same telemetry opt-out as the verify job.
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          # Same pin as the verify job — keep both jobs on one CLI version.
          version: 2.105.0
      # Fork and dependabot PRs get no repo secrets; `supabase link` with an
      # empty project ref would fail the job for a reason unrelated to the
      # diff. Skip the check there — deploy.yml re-asserts parity on push.
      - if: env.PROJECT_REF != ''
        run: supabase link --project-ref "$PROJECT_REF"
      - if: env.PROJECT_REF != ''
        run: npm run migrations:check-drift
